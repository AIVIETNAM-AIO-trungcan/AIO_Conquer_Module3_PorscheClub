[project]
name = "sales-forecast"
version = "0.1.0"
description = "AIO Conquer 2026 - Module 03 - Project 3.2: Sales Forecasting and Demand Prediction Using LightGBM and SHAP"
requires-python = ">=3.10,<3.14"
readme = "README.md"

dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<5.0",
    "xgboost>=2.0,<3.0",
    "optuna>=3.6,<4.0",
    "shap>=0.45,<0.46",
    "pyyaml>=6.0,<7.0",
    "pandera>=0.19,<0.20",
    "pyarrow>=15.0,<16.0",
    "matplotlib>=3.8,<4.0",
    "plotly>=5.20,<6.0",
    "streamlit>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "jupyter>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
