# Cấu hình dữ liệu (Data I/O)
# Xem: docs/06_environment_setup.md, docs/03_data_io_diagram.md

data_paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  predictions_dir: "data/predictions"
  reports_dir: "reports"

raw_files:
  train: "train.csv"
  test: "test.csv"
  features: "features.csv"
  stores: "stores.csv"

temporal_split:
  # Mốc cắt train/valid/test
  # Format: YYYY-MM-DD
  # LƯU Ý: train_end_date/valid_end_date KHÔNG còn được pipelines/run_train_baseline.py
  # sử dụng — pipeline đó nay chia train/valid theo tỷ lệ 2/3 số ngày duy nhất
  # (src/sales_forecast/splitting/ratio_split.py), xem docs/00_decisions.md
  # "Đồng bộ xử lý dữ liệu theo notebooks/01. Preprocessing.ipynb". Giữ lại 2 key
  # này (không xóa) phòng khi có pipeline khác cần mốc ngày cố định.
  train_end_date: "2011-12-31"  # Tham khảo từ 02_pipeline_architecture.md
  valid_end_date: "2012-12-31"
  # test_end_date: được suy ra từ test.csv

target_column: "Weekly_Sales"
store_column: "Store"
# dept_column đã bị loại bỏ - đơn vị dự báo đổi sang (Store, Date),
# xem docs/00_decisions.md [2026-08-19] "Đổi đơn vị dự báo"
date_column: "Date"
date_format: "%Y-%m-%d"

# Kiểm tra dữ liệu
expected_raw_files:
  train.csv: 421570
  test.csv: 115064
  features.csv: 8190
  stores.csv: 45
